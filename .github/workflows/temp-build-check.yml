name: Temporary build check

on:
  push:
    branches:
      - improve-summary-logbook

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flight-stats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: flight-stats/package-lock.json
      - run: npm ci
      - run: npm run build
